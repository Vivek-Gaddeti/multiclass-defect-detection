version: '3.8'

services:
  defect-detection-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defect-detection-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
